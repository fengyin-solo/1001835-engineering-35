# 公众诉求发布清单（唯一事实来源）
#
# 发布前所有检查都以本文件为准，不要在脚本、docker-compose、.env.example
# 等处另立数字。清单由 release-check 流水线维护：
#   make preflight            按清单跑全部检查
#   make preflight-reset      丢弃上次进度，从头再跑
#
# 台账录入顺序无所谓：回填示例数据时一律按「采集时间」升序排列。
# 注意：中文字段名在 TOML 里必须加引号。

[pipeline]
# 步骤按此顺序执行；失败后再次运行会从第一个未通过的步骤继续
steps = ["deps", "seed", "config", "health", "complaints"]
work_dir = ".release/work"

[backend]
dir = "backend"
# requirements.txt 由本清单渲染，手工改动会在 deps 步骤被覆盖
requirements = "backend/requirements.txt"
python_min = "3.11"
module = "app.main:app"
host = "127.0.0.1"
port = 8000
# 健康探针相对路径
health_path = "/api/health"
start_timeout = 30

[[backend.dependencies]]
name = "fastapi"
spec = ">=0.110"

[[backend.dependencies]]
name = "uvicorn"
# 发行包名（pip 安装名）与 import 名不同时在这里写
dist = "uvicorn"
spec = ">=0.29"
extra = "[standard]"

[[backend.dependencies]]
name = "pydantic"
spec = ">=2.6"

# 端口核对：同一端口在各处的声明必须一致
[[ports]]
service = "backend"
port = 8000
sources = ["docker-compose.yml", "backend/Dockerfile", "backend/run.sh"]

[[ports]]
service = "frontend"
port = 5173
sources = ["docker-compose.yml", "frontend/Dockerfile", "frontend/vite.config.ts"]

# 环境变量核对：变量名必须出现在对应文件里
[[env_vars]]
name = "APP_ENV"
value = "local"
sources = ["docker-compose.yml", ".env.example"]

[[env_vars]]
name = "VITE_APP_NAME"
sources = ["frontend/.env.development"]

[frontend]
dir = "frontend"
port = 5173

[complaints]
# 公众诉求接口与台账一致性核对
list_path = "/api/complaint"
export_path = "/api/complaint/export"
page_size = 200
# 回填生成的示例数据文件（seed.py 启动时加载它）
generated_seed = "backend/app/seed_complaint_generated.py"
required_fields = ["诉求编号", "诉求来源", "诉求内容", "涉及管段", "受理人员", "处理措施", "办理期限"]
# 状态流转序列，最后一个视为终态（pending=false）
status_flow = ["待受理", "办理中", "已回复", "已关闭"]

# ===== 存量诉求台账（录入顺序无关，按「采集时间」升序回填）=====

